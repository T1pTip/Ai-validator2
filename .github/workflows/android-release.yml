name: Signed Android Release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          test -n "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Check signing configuration
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in RELEASE_KEYSTORE_B64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done
      - name: Build unsigned release
        run: gradle --no-daemon :app:assembleRelease :app:lintRelease :app:assembleDebug :app:lintDebug
      - name: Sign and verify release APK
        shell: bash
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          KEYSTORE="$(mktemp)"
          trap 'rm -f "$KEYSTORE"' EXIT
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          mkdir -p release-artifacts
          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" release-artifacts/app-release-aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks "$KEYSTORE" \
            --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --ks-pass env:RELEASE_KEYSTORE_PASSWORD \
            --key-pass env:RELEASE_KEY_PASSWORD \
            --out release-artifacts/ai-origin-release.apk \
            release-artifacts/app-release-aligned.apk
          rm release-artifacts/app-release-aligned.apk
          bash qa/apk-evidence.sh release-artifacts/ai-origin-release.apk release-artifacts
          # Preserve the existing release signer; key rotation needs a migration plan.
          grep -q 'certificate SHA-256 digest: 45dfa607f188a6d4e8e8facc24ff07e9dc27a759081e39adffd7042fa114299b' release-artifacts/signature.txt
      - name: Enable KVM acceleration for emulator
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "::error::KVM is unavailable on this runner"
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
      - name: Install and launch signed APK on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          target: default
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -no-metrics
          script: bash "$GITHUB_WORKSPACE/qa/release-smoke-test.sh"
      - name: Install and launch signed APK on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          target: google_apis
          force-avd-creation: true
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -no-metrics
          script: bash "$GITHUB_WORKSPACE/qa/release-smoke-test.sh"
      - name: Upload verified signed release
        uses: actions/upload-artifact@v4
        with:
          name: ai-origin-signed-release
          path: |
            release-artifacts/ai-origin-release.apk
            release-artifacts/*.txt
          if-no-files-found: error
      - name: Preserve evidence even when emulator checks fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-origin-release-evidence
          path: release-artifacts/*.txt
          if-no-files-found: ignore
