name: Signed Android Release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          test -n "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Check signing configuration
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in RELEASE_KEYSTORE_B64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done
      - name: Build unsigned release
        run: gradle --no-daemon :app:assembleRelease :app:lintRelease
      - name: Sign and verify release APK
        shell: bash
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          KEYSTORE="$(mktemp)"
          trap 'rm -f "$KEYSTORE"' EXIT
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          mkdir -p release-artifacts
          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" release-artifacts/app-release-aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks "$KEYSTORE" \
            --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --ks-pass env:RELEASE_KEYSTORE_PASSWORD \
            --key-pass env:RELEASE_KEY_PASSWORD \
            --out release-artifacts/ai-origin-release.apk \
            release-artifacts/app-release-aligned.apk
          rm release-artifacts/app-release-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs release-artifacts/ai-origin-release.apk
          sha256sum release-artifacts/ai-origin-release.apk > release-artifacts/SHA256SUMS.txt
      - name: Check APK compatibility and install on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          target: google_apis
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            set -euo pipefail
            APK="release-artifacts/ai-origin-release.apk"
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "^(package:|sdkVersion:|targetSdkVersion:|launchable-activity:)"
            adb wait-for-device
            adb shell getprop sys.boot_completed
            adb install -r "$APK"
            adb shell pm path com.aiorigin.detector | grep '^package:'
            adb shell am start -W -n com.aiorigin.detector/.MainActivity
            sleep 5
            adb shell dumpsys activity activities | grep -E "com.aiorigin.detector|mResumedActivity|topResumedActivity"
            if adb logcat -d -t 1000 | grep -E "FATAL EXCEPTION|Process: com.aiorigin.detector" | grep -q "com.aiorigin.detector"; then
              echo "::error::Possible app crash detected; review emulator logcat"
              exit 1
            fi
      - name: Upload verified signed release
        uses: actions/upload-artifact@v4
        with:
          name: ai-origin-signed-release
          path: |
            release-artifacts/ai-origin-release.apk
            release-artifacts/SHA256SUMS.txt
          if-no-files-found: error
