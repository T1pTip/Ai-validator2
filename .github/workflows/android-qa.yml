name: Android QA
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Kotlin compiler for isolated JVM checks
        run: |
          curl -fsSL https://get.sdkman.io | bash
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          sdk install kotlin 2.0.21
          echo "$HOME/.sdkman/candidates/kotlin/current/bin" >> "$GITHUB_PATH"
      - name: Test metadata components
        run: bash qa/run-jvm-tests.sh
      - name: Compile Android debug APK and run lint
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-origin-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
